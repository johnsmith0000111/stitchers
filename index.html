<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bad State Checker</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #4a90e2;
            --border-color: #dddddd;
            --red-alert: #d9534f;
            --green-alert: #5cb85c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
            color: #555;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 18px;
            box-sizing: border-box;
            transition: border-color 0.3s;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        .result-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status-badge {
            font-size: 24px;
            font-weight: bold;
            color: white;
            padding: 12px 25px;
            border-radius: 6px;
            display: inline-block;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .state-info {
            font-size: 18px;
            font-weight: 500;
            color: #333;
        }

        .not-qualified {
            background-color: #fdf2f2;
            border: 2px solid var(--red-alert);
        }
        .not-qualified .status-badge {
            background-color: var(--red-alert);
        }

        .qualified {
            background-color: #f2fdf2;
            border: 2px solid var(--green-alert);
        }
        .qualified .status-badge {
            background-color: var(--green-alert);
        }

        .unknown {
            background-color: #f7f7f7;
            border: 2px solid #aaa;
            color: #666;
        }

        .instructions {
            font-size: 13px;
            color: #777;
            margin-top: 15px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Bad State Checker</h2>
    
    <div class="input-group">
        <label for="phoneNumber">Enter US Phone Number:</label>
        <input type="text" id="phoneNumber" placeholder="e.g., (213) 555-0199 or 5124443333" autocomplete="off">
    </div>

    <div id="result" class="result-box">
        <div id="statusBadge" class="status-badge"></div>
        <div id="stateDetails" class="state-info"></div>
    </div>

    <div class="instructions">
        Number likhte hi checker automatic area code check kar lega. <br>
        <strong>Not Qualified (RED):</strong> CA, CT, FL, MA, MD, MI, NE, NJ, NY, PA, PR, RI, SC, TN, VT, WI.
    </div>
</div>

<script>

    const areaCodes = {

        "205":"AL","251":"AL","256":"AL","334":"AL",

        "307":"WY"
    };

    // State Codes K Full Names (Display ke liye)
    const stateNames = {
        "CA":"California", "CT":"Connecticut", "FL":"Florida", "MA":"Massachusetts", "MD":"Maryland", 
        "MI":"Michigan", "NE":"Nebraska", "NJ":"New Jersey", "NY":"New York", "PA":"Pennsylvania", 
        "PR":"Puerto Rico", "RI":"Rhode Island", "SC":"South Carolina", "TN":"Tennessee", 
        "VT":"Vermont", "WI":"Wisconsin", "AL":"Alabama", "AK":"Alaska", "AZ":"Arizona", 
        "AR":"Arkansas", "CO":"Colorado", "DC":"Washington D.C.", "GA":"Georgia", "HI":"Hawaii", 
        "ID":"Idaho", "IL":"Illinois", "IN":"Indiana", "IA":"Iowa", "KS":"Kansas", "KY":"Kentucky", 
        "LA":"Louisiana", "ME":"Maine", "MN":"Minnesota", "MS":"Mississippi", "MO":"Missouri", 
        "MT":"Montana", "NV":"Nevada", "NH":"New Hampshire", "NM":"New Mexico", "NC":"North Carolina", 
        "ND":"North Dakota", "OH":"Ohio", "OK":"Oklahoma", "OR":"Oregon", "SD":"South Dakota", 
        "TX":"Texas", "UT":"Utah", "VA":"Virginia", "WA":"Washington", "WV":"West Virginia", "WY":"Wyoming"
    };

    // Blacklist States (Not Qualified)
    const blacklist = ["CA", "CT", "FL", "MA", "MD", "MI", "NE", "NJ", "NY", "PA", "PR", "RI", "SC", "TN", "VT", "WI"];

    const phoneInput = document.getElementById('phoneNumber');
    const resultBox = document.getElementById('result');
    const statusBadge = document.getElementById('statusBadge');
    const stateDetails = document.getElementById('stateDetails');

    phoneInput.addEventListener('input', function() {
        let value = this.value;
        
        // Sirf numbers bacha rha hai baki brackets aur dashes remove kar rha hai
        let cleaned = value.replace(/\D/g, '');

        // Agar number +1 se start ho rha hai to usse skip karo
        if (cleaned.startsWith('1') && cleaned.length > 3) {
            cleaned = cleaned.substring(1);
        }

        // Jab tak kam se kam 3 digit (Area Code) nahi milte result hide rakho
        if (cleaned.length < 3) {
            resultBox.style.display = 'none';
            return;
        }

        // Pehle 3 digits ko Area Code assume kiya
        let areaCode = cleaned.substring(0, 3);
        let stateCode = areaCodes[areaCode];

        resultBox.style.display = 'block';

        if (stateCode) {
            let fullStateName = stateNames[stateCode] || stateCode;
            stateDetails.innerHTML = `Area Code: <strong>${areaCode}</strong> | State: <strong>${fullStateName} (${stateCode})</strong>`;
            
            // Check condition
            if (blacklist.includes(stateCode)) {
                resultBox.className = 'result-box not-qualified';
                statusBadge.innerText = 'Not Qualified';
            } else {
                resultBox.className = 'result-box qualified';
                statusBadge.innerText = 'Qualified';
            }
        } else {
            // Agar area code database me na mile
            resultBox.className = 'result-box unknown';
            statusBadge.innerText = 'Unknown Area Code';
            stateDetails.innerHTML = `Area Code <strong>${areaCode}</strong> is not recognized in standard US database.`;
        }
    });
</script>

</body>
</html>
